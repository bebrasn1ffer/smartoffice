global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 15s
  external_labels:
    monitor: mon-01

scrape_configs:
  - job_name: office-controller
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['192.168.20.10:8080']
        labels:
          instance: ctrl-01
          env: office
